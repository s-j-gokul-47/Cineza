server:
  port: 8080

spring:
  application:
    name: cineza-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/cineza_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000ms

# Seat lock configuration with explicit 10-minute TTL requirement
cineza:
  seat-lock:
    ttl-minutes: 10
    ttl-seconds: 600
    lock-prefix: "cineza:lock:show:"

logging:
  level:
    com.cineza: DEBUG
    org.springframework.data.redis: INFO
