  <!-- Local secret configuration (excluded from Git) -->
  <script src="msg91_config.js"></script>

  <script type="text/javascript">
    window.cinezaMsg91Ready = false;
    window.cinezaMsg91LastError = null;

    var configuration = {
      widgetId: "366a79684469353833313838",
      tokenAuth: window.cinezaMsg91TokenAuth || "YOUR_MSG91_WIDGET_TOKEN",
      exposeMethods: true,
      success: function (data) {
        console.log("[Cineza MSG91] Default Success:", data);
        window.cinezaMsg91LastSuccess = data;
      },
      failure: function (error) {
        console.error("[Cineza MSG91] Default Failure:", error);
        window.cinezaMsg91LastError = error;
      }
    };

    window.initCinezaMsg91 = function () {
      if (typeof window.initSendOTP === "function") {
        try {
          window.initSendOTP(configuration);
          window.cinezaMsg91Ready = true;
          console.log("[Cineza] initSendOTP called successfully.");
        } catch (e) {
          console.error("[Cineza] initSendOTP exception:", e);
          window.cinezaMsg91LastError = e;
        }
      }
    };

    // Resilient script loader with fallback URLs as provided by MSG91
    (function loadOtpScript(urls) {
      let i = 0;
      function attempt() {
        const s = document.createElement('script');
        s.src = urls[i];
        s.async = true;
        s.onload = () => {
          console.log("[Cineza] MSG91 OTP script loaded from: " + urls[i]);
          if (typeof window.initSendOTP === 'function') {
            window.initSendOTP(configuration);
            window.cinezaMsg91Ready = true;
            console.log("[Cineza] initSendOTP initialized successfully with tokenAuth.");
          }
        };
        s.onerror = () => {
          console.warn("[Cineza] Failed to load OTP script from: " + urls[i]);
          i++;
          if (i < urls.length) {
            attempt();
          }
        };
        document.head.appendChild(s);
      }
      attempt();
    })([
      'https://verify.msg91.com/otp-provider.js',
      'https://verify.phone91.com/otp-provider.js'
    ]);

    // Safe wrappers called by Flutter
    window.cinezaSendOtp = function (identifier, successCb, failureCb) {
      console.log("[Cineza] Sending OTP to:", identifier);
      if (typeof window.sendOtp !== "function" && typeof window.initCinezaMsg91 === "function") {
        window.initCinezaMsg91();
      }
      if (typeof window.sendOtp === "function") {
        try {
          window.sendOtp(
            identifier,
            function (res) {
              console.log("[Cineza] sendOtp success:", res);
              if (typeof successCb === "function") successCb(res);
            },
            function (err) {
              console.error("[Cineza] sendOtp failure:", err);
              if (typeof failureCb === "function") failureCb(err);
            }
          );
        } catch (e) {
          console.error("[Cineza] sendOtp threw exception:", e);
          if (typeof failureCb === "function") failureCb(String(e));
        }
      } else {
        const msg = "MSG91 OTP widget is still initializing. Please try again in a moment.";
        console.warn("[Cineza] " + msg);
        if (typeof failureCb === "function") failureCb(msg);
      }
    };

    window.cinezaVerifyOtp = function (otp, successCb, failureCb, reqId) {
      console.log("[Cineza] Verifying OTP:", otp, "reqId:", reqId);
      if (typeof window.verifyOtp === "function") {
        try {
          window.verifyOtp(
            otp,
            function (res) {
              console.log("[Cineza] verifyOtp success:", res);
              if (typeof successCb === "function") successCb(res);
            },
            function (err) {
              console.error("[Cineza] verifyOtp failure:", err);
              if (typeof failureCb === "function") failureCb(err);
            },
            reqId
          );
        } catch (e) {
          console.error("[Cineza] verifyOtp threw exception:", e);
          if (typeof failureCb === "function") failureCb(String(e));
        }
      } else {
        const msg = "MSG91 verifyOtp is not ready.";
        console.warn("[Cineza] " + msg);
        if (typeof failureCb === "function") failureCb(msg);
      }
    };

    window.cinezaRetryOtp = function (channel, successCb, failureCb, reqId) {
      console.log("[Cineza] Retrying OTP, channel:", channel, "reqId:", reqId);
      if (typeof window.retryOtp === "function") {
        try {
          window.retryOtp(
            channel,
            function (res) {
              console.log("[Cineza] retryOtp success:", res);
              if (typeof successCb === "function") successCb(res);
            },
            function (err) {
              console.error("[Cineza] retryOtp failure:", err);
              if (typeof failureCb === "function") failureCb(err);
            },
            reqId
          );
        } catch (e) {
          console.error("[Cineza] retryOtp threw exception:", e);
          if (typeof failureCb === "function") failureCb(String(e));
        }
      } else {
        const msg = "MSG91 retryOtp is not ready.";
        console.warn("[Cineza] " + msg);
        if (typeof failureCb === "function") failureCb(msg);
      }
    };

    // Authentic Procedural Cinema Clapperboard Clap Sound (Web Audio API)
    window.cinezaPlayClapperSound = function () {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        const now = ctx.currentTime;

        // 1. Sharp wooden slap transient (triangle pitch drop)
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(75, now + 0.05);

        oscGain.gain.setValueAtTime(0.9, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.07);

        // 2. Heavy hollow wood body impact (filtered noise burst)
        const bufferSize = Math.floor(ctx.sampleRate * 0.09);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.22));
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1250, now);
        filter.Q.setValueAtTime(2.0, now);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.85, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(now);
      } catch (e) {
        console.warn('[Cineza] Clap sound suppressed:', e);
      }
    };

    // Save and retrieve Cineza user session across page reloads
    window.cinezaSaveUserSession = function (userDataJson) {
      try {
        if (window.localStorage) {
          window.localStorage.setItem('cineza_local_user', userDataJson);
        }
      } catch (e) {
        console.warn('[Cineza] Error saving user session:', e);
      }
    };

    window.cinezaLoadUserSession = function () {
      try {
        if (window.localStorage) {
          return window.localStorage.getItem('cineza_local_user') || '';
        }
      } catch (e) {
        console.warn('[Cineza] Error loading user session:', e);
      }
      return '';
    };

    // Erase all web session storage, cookies/states on user logout
    window.cinezaClearWebSession = function () {
      try {
        if (window.sessionStorage) {
          window.sessionStorage.clear();
        }
        if (window.localStorage) {
          window.localStorage.removeItem('cineza_local_user');
        }
        window.cinezaMsg91LastSuccess = null;
        window.cinezaMsg91LastError = null;
        console.log('[Cineza] All web session and cached states erased successfully.');
      } catch (e) {
        console.warn('[Cineza] Error clearing web session:', e);
      }
    };
  </script>
