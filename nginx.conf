events {
    worker_connections 1024;
}

http {
    # Embedded DNS resolver injected from NGINX_DNS_RESOLVER (Docker DNS by default)
    # so scaling replicas up/down or container restarts update the pool automatically.
    resolver ${NGINX_DNS_RESOLVER} valid=5s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 80;

        # Variable in proxy_pass forces Nginx to honor `resolver` TTL instead of
        # freezing container IPs once at startup.
        set $backend_upstream ${BACKEND_SERVICE_URL};

        # Dedicated load-balancer health endpoint for Docker healthcheck
        location = /lb-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
