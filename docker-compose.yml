services:
  mysql:
    image: mysql:8.0
    container_name: cineza-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cineza_db}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MYSQL_LOCAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cineza-net

  redis:
    image: redis:7-alpine
    container_name: cineza-redis
    restart: always
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cineza-net

  backend:
    build: ./backend
    restart: always
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cineza_db}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-cineza_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT:-6379}
      - CINEZA_CORS_ALLOWED_ORIGINS=${CINEZA_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*}
      # Resilience & external gateway configuration (optional in local dev)
      - CINEZA_CB_FAILURE_THRESHOLD=${CINEZA_CB_FAILURE_THRESHOLD:-3}
      - CINEZA_CB_OPEN_DURATION_MS=${CINEZA_CB_OPEN_DURATION_MS:-30000}
      - CINEZA_CB_TIMEOUT_MS=${CINEZA_CB_TIMEOUT_MS:-4000}
      - CINEZA_AUTH_GATEWAY_URL=${CINEZA_AUTH_GATEWAY_URL:-}
      - CINEZA_PAYMENT_GATEWAY_URL=${CINEZA_PAYMENT_GATEWAY_URL:-}
      - CINEZA_PAYMENT_API_KEY=${CINEZA_PAYMENT_API_KEY:-}
      - CINEZA_EMAIL_SERVICE_URL=${CINEZA_EMAIL_SERVICE_URL:-}
      - CINEZA_EMAIL_API_KEY=${CINEZA_EMAIL_API_KEY:-}
      # Optional in local dev (falls back in app); required in production via .env
      - CINEZA_JWT_SECRET=${CINEZA_JWT_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${SERVER_PORT:-8080}/health\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      replicas: 3 # Change this single number (or run with --scale backend=N) to scale
      restart_policy:
        condition: any
    networks:
      - cineza-net

  nginx:
    image: nginx:alpine
    container_name: cineza-nginx-lb
    restart: always
    environment:
      - NGINX_DNS_RESOLVER=${NGINX_DNS_RESOLVER:-127.0.0.11}
      - BACKEND_SERVICE_URL=${BACKEND_SERVICE_URL:-http://backend:${SERVER_PORT:-8080}}
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
    entrypoint:
      - /bin/sh
      - -c
      - "envsubst '$${NGINX_DNS_RESOLVER} $${BACKEND_SERVICE_URL}' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/lb-health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - cineza-net

volumes:
  mysql_data:
  redis_data:

networks:
  cineza-net:
    driver: bridge
