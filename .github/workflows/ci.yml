name: Cineza CI

# ──────────────────────────────────────────────────────────────────────────────
# Trigger: every pull-request (open / sync / reopen) targeting any branch,
# plus manual dispatch from the Actions tab.
# Branch protection should require this workflow to pass before merging.
# ──────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel any in-progress run for the same PR so resources aren't wasted.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
# Job 1 — Flutter frontend: install → lint → type-check (analyze) → test
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  flutter-ci:
    name: "Flutter — lint, analyze & test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter (stable channel, version pinned from pubspec SDK constraint)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"   # Satisfies sdk: ^3.13.5; bump here when needed
          channel: stable
          cache: true

      # 3. Install pub dependencies
      - name: flutter pub get
        run: flutter pub get

      # 4. Lint — flutter_lints rules (analysis_options.yaml)
      #    --fatal-infos turns every info-level lint into a build failure.
      - name: flutter analyze (lint + type-check)
        run: flutter analyze --fatal-warnings --fatal-infos

      # 5. Run all tests (widget + unit).
      #    --coverage generates coverage/lcov.info for optional upload.
      - name: flutter test
        run: flutter test --coverage

      # 6. (Optional) Upload coverage to Codecov – set CODECOV_TOKEN secret to enable.
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        continue-on-error: true        # Don't block merge on Codecov outages
        with:
          files: coverage/lcov.info
          flags: flutter
          token: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2 — Java / Spring Boot backend: compile → checkstyle → test (H2 + Redis)
  # ──────────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: "Backend — compile, checkstyle & test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Service containers — started before the job steps.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (matches pom.xml <java.version>17</java.version>)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # 3. Validate POM (catches XML errors and dependency resolution failures)
      - name: Validate POM
        run: mvn --batch-mode validate

      # 4. Compile — fails fast on any Java compilation error
      - name: Compile
        run: mvn --batch-mode compile -DskipTests

      # 5. Run all tests.
      #    - Uses H2 (in-memory) instead of MySQL; controlled by the test
      #      application properties written below.
      #    - Redis service container is live on port 6379.
      #    - Secrets are injected as env vars; never hard-coded.
      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:cineza_test;DB_CLOSE_DELAY=-1;MODE=MySQL
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_DATASOURCE_DRIVER: org.h2.Driver
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          CINEZA_JWT_SECRET: ${{ secrets.CINEZA_JWT_SECRET || 'ci-test-secret-key-at-least-256-bits-long-for-hs512' }}
        run: mvn --batch-mode test

      # 6. Publish Surefire test report as a GitHub check annotation
      - name: Publish test results
        if: always()                   # Show results even when tests fail
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Results
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: true

      # 7. Upload JAR artifact (useful for review / quick staging deploy)
      - name: Build JAR (skip tests — already ran)
        run: mvn --batch-mode package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cineza-backend-${{ github.sha }}
          path: backend/target/*.jar
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 3 — Guard gate: explicitly requires both jobs to pass.
  #          Set this job as the required status check in branch protection.
  # ──────────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: "CI Gate (required for merge)"
    runs-on: ubuntu-latest
    needs: [flutter-ci, backend-ci]
    if: always()                        # Always runs so it can report failure
    steps:
      - name: Evaluate all jobs
        run: |
          echo "Flutter CI result : ${{ needs.flutter-ci.result }}"
          echo "Backend CI result : ${{ needs.backend-ci.result }}"

          if [[ "${{ needs.flutter-ci.result }}" != "success" ]] || \
             [[ "${{ needs.backend-ci.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed. Merge is blocked."
            exit 1
          fi

          echo "All CI jobs passed. Ready to merge ✓"
